version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bluestore_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    ports:
      - '5432:5432'
  redis:
    image: redis:7
    ports:
      - '6379:6379'
  web:
    build:
      context: .
      dockerfile: shop_project/Dockerfile
    command: bash -c 'python manage.py migrate && daphne -b 0.0.0.0 -p 8000 shop_project.asgi:application'
    ports:
      - '8000:8000'
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_POST=5432
      - DB_NAME=bluestore_db
      - DB_USER=admin
      - DB_PASSWORD=admin_password
      - REDIS_HOST=redis